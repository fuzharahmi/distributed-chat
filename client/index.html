<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Distributed Group Chat System - Sistem chat terdistribusi real-time menggunakan Socket.io dan Redis Pub/Sub">
  <title>Distributed Chat | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
  <!-- ============================================ -->
  <!--  ANIMATED BACKGROUND                         -->
  <!-- ============================================ -->
  <div class="bg-animation">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
    <div class="bg-grid"></div>
  </div>

  <!-- ============================================ -->
  <!--  MAIN LOGIN CONTAINER                        -->
  <!-- ============================================ -->
  <div class="login-container">
    <!-- Branding Header -->
    <div class="login-header">
      <div class="logo-icon">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="url(#logo-gradient)" />
          <path
            d="M14 16C14 14.8954 14.8954 14 16 14H32C33.1046 14 34 14.8954 34 16V28C34 29.1046 33.1046 30 32 30H26L20 36V30H16C14.8954 30 14 29.1046 14 28V16Z"
            fill="white" fill-opacity="0.9" />
          <circle cx="20" cy="22" r="2" fill="url(#dot-gradient)" />
          <circle cx="24" cy="22" r="2" fill="url(#dot-gradient)" />
          <circle cx="28" cy="22" r="2" fill="url(#dot-gradient)" />
          <defs>
            <linearGradient id="logo-gradient" x1="0" y1="0" x2="48" y2="48">
              <stop stop-color="#6366F1" />
              <stop offset="1" stop-color="#8B5CF6" />
            </linearGradient>
            <linearGradient id="dot-gradient" x1="20" y1="20" x2="28" y2="24">
              <stop stop-color="#6366F1" />
              <stop offset="1" stop-color="#8B5CF6" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>Distributed Chat</h1>
      <p class="subtitle">Sistem Chat Terdistribusi Real-Time</p>
    </div>

    <!-- Architecture Info Badge -->
    <div class="arch-badge">
      <div class="arch-badge-item">
        <span class="arch-dot pulse-dot"></span>
        <span>Multi-Server</span>
      </div>
      <div class="arch-divider"></div>
      <div class="arch-badge-item">
        <span class="arch-dot pulse-dot delay-1"></span>
        <span>Redis Pub/Sub</span>
      </div>
      <div class="arch-divider"></div>
      <div class="arch-badge-item">
        <span class="arch-dot pulse-dot delay-2"></span>
        <span>Socket.io</span>
      </div>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="login-form" autocomplete="off">
      <div class="form-group">
        <label for="usernameInput">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          Nama Pengguna
        </label>
        <input type="text" id="usernameInput" placeholder="Masukkan nama kamu..." required maxlength="20" autofocus>
      </div>

      <div class="form-group">
        <label for="roomSelect">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg>
          Pilih Departemen / Room
        </label>
        <div class="select-wrapper">
          <select id="roomSelect" required>
            <option value="" disabled selected>Pilih room...</option>
            <option value="Teknik Informatika">🖥️ Teknik Informatika</option>
            <option value="Sistem Informasi">📊 Sistem Informasi</option>
            <option value="Manajemen">📈 Manajemen</option>
            <option value="Umum">🌐 Umum</option>
          </select>
          <svg class="select-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </div>
      </div>

      <button type="submit" id="joinBtn" class="btn-join">
        <span class="btn-text">Masuk Chat</span>
        <svg class="btn-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12" />
          <polyline points="12 5 19 12 12 19" />
        </svg>
      </button>
    </form>

    <!-- Server Status Indicator -->
    <div class="server-status" id="serverStatus">
      <span class="status-dot"></span>
      <span class="status-text">Menghubungkan ke server...</span>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <p>Tugas Sistem Terdistribusi &mdash; 2026</p>
    </div>
  </div>

  <!-- Socket.io client -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>

</html>
