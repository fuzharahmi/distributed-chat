<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Distributed Group Chat - Chat Room Real-Time">
  <title>Distributed Chat | Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="chat-page">
  <!-- ============================================ -->
  <!--  CHAT APPLICATION LAYOUT                     -->
  <!-- ============================================ -->
  <div class="chat-app" id="chatApp">

    <!-- ========================================== -->
    <!--  SIDEBAR - Online Users                    -->
    <!-- ========================================== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          Online
        </h2>
        <span class="online-count" id="onlineCount">0</span>
      </div>
      <ul class="user-list" id="userList">
        <!-- User items akan diisi oleh JavaScript -->
      </ul>
      <div class="sidebar-footer">
        <div class="server-info">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/>
            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"/>
            <line x1="6" y1="6" x2="6.01" y2="6"/>
            <line x1="6" y1="18" x2="6.01" y2="18"/>
          </svg>
          <span id="serverInfo">Connecting...</span>
        </div>
      </div>
    </aside>

    <!-- ========================================== -->
    <!--  MAIN CHAT AREA                            -->
    <!-- ========================================== -->
    <main class="chat-main">
      <!-- Chat Header -->
      <header class="chat-header" id="chatHeader">
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="header-info">
          <h1 id="roomName">Loading...</h1>
          <div class="header-meta">
            <span class="header-badge" id="headerOnline">
              <span class="live-dot"></span>
              <span id="headerOnlineCount">0</span> online
            </span>
            <span class="header-badge distributed-badge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
              Distributed
            </span>
          </div>
        </div>
        <button class="btn-leave" id="leaveBtn" title="Keluar dari room">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Keluar</span>
        </button>
      </header>

      <!-- Messages Area -->
      <div class="messages-container" id="messagesContainer">
        <div class="messages-scroll" id="messagesScroll">
          <!-- Welcome message -->
          <div class="welcome-message" id="welcomeMessage">
            <div class="welcome-icon">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </div>
            <h3>Selamat datang di room!</h3>
            <p>Pesan dikirim secara real-time melalui Redis Pub/Sub ke semua server.</p>
          </div>
          <!-- Messages akan diisi oleh JavaScript -->
        </div>
      </div>

      <!-- Typing Indicator -->
      <div class="typing-indicator" id="typingIndicator" style="display: none;">
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
        <span class="typing-text" id="typingText">Seseorang sedang mengetik...</span>
      </div>

      <!-- Message Input -->
      <div class="message-input-container">
        <form id="messageForm" class="message-form">
          <div class="input-wrapper">
            <input 
              type="text" 
              id="messageInput" 
              placeholder="Ketik pesan..." 
              autocomplete="off"
              maxlength="500"
            >
          </div>
          <button type="submit" id="sendBtn" class="btn-send" title="Kirim pesan">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </form>
      </div>
    </main>
  </div>

  <!-- Overlay for mobile sidebar -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Notification sound (opsional) -->
  <!-- <audio id="notifSound" src="notif.mp3" preload="auto"></audio> -->

  <!-- Socket.io client -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
